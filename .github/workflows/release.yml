name: BusCourse Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "BusCourse version (MAJOR.MINOR.PATCH)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must match MAJOR.MINOR.PATCH (for example 1.2.3)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # v3 の既定 packages は旧 SDK Tools `tools` を含み、Google から削除済み。
        with:
          packages: 'platform-tools'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore BusCourse release keystore
        env:
          BUSCOURSE_KEYSTORE_BASE64: ${{ secrets.BUSCOURSE_KEYSTORE_BASE64 }}
          BUSCOURSE_STORE_PASSWORD: ${{ secrets.BUSCOURSE_STORE_PASSWORD }}
          BUSCOURSE_KEY_ALIAS: ${{ secrets.BUSCOURSE_KEY_ALIAS }}
          BUSCOURSE_KEY_PASSWORD: ${{ secrets.BUSCOURSE_KEY_PASSWORD }}
        run: |
          if [ -z "$BUSCOURSE_KEYSTORE_BASE64" ] || [ -z "$BUSCOURSE_STORE_PASSWORD" ] || \
             [ -z "$BUSCOURSE_KEY_ALIAS" ] || [ -z "$BUSCOURSE_KEY_PASSWORD" ]; then
            echo "::error::All four BusCourse signing secrets must be configured."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/buscourse-release.p12"
          if ! printf '%s' "$BUSCOURSE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH" || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Could not restore the BusCourse release keystore."
            exit 1
          fi
          # ★合言葉は $GITHUB_ENV に書かない（後のステップ全体へ漏らさない）。ビルドのステップにだけ env で渡す。
          echo "BUSCOURSE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Stop if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="buscourse-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Compute versionCode and versionName
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "VERSION_CODE=$((100 + $GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Build BusCourse release and navi APKs
        env:
          BUSCOURSE_STORE_PASSWORD: ${{ secrets.BUSCOURSE_STORE_PASSWORD }}
          BUSCOURSE_KEY_ALIAS: ${{ secrets.BUSCOURSE_KEY_ALIAS }}
          BUSCOURSE_KEY_PASSWORD: ${{ secrets.BUSCOURSE_KEY_PASSWORD }}
        # ナビ専科（buildType navi・com.istech.buscourse.navi）も同じ release 鍵で組む（2026-10-02 オーナー依頼）。
        run: ./gradlew :buscourse:testDebugUnitTest :buscourse:assembleRelease :buscourse:assembleNavi --no-daemon --stacktrace

      - name: Verify release and navi APKs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          # verify <APK> <期待する applicationId> <期待する versionName>
          verify() {
            local APK="$1" APP_ID="$2" WANT_NAME="$3"
            if [ ! -f "$APK" ]; then
              echo "::error::Expected APK was not produced: $APK"
              exit 1
            fi
            if "$AAPT" dump permissions "$APK" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)'; then
              echo "::error::$APK requests a network permission."
              exit 1
            fi
            local CERTS
            CERTS=$("$APKSIGNER" verify --print-certs "$APK")
            if ! grep -q 'Signer #1 certificate DN:' <<< "$CERTS"; then
              echo "::error::$APK signature verification did not report a signer."
              exit 1
            fi
            if grep -q 'CN=Android Debug' <<< "$CERTS"; then
              echo "::error::$APK is signed with the Android debug certificate."
              exit 1
            fi
            local BADGING PKG NAME
            BADGING=$("$AAPT" dump badging "$APK")
            PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$BADGING")
            NAME=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
            if [ "$PKG" != "$APP_ID" ]; then
              echo "::error::$APK applicationId '$PKG' is not '$APP_ID'."
              exit 1
            fi
            if [ "$NAME" != "$WANT_NAME" ]; then
              echo "::error::$APK versionName '$NAME' does not match '$WANT_NAME'."
              exit 1
            fi
            grep 'SHA-256 digest' <<< "$CERTS" | head -1 > "$RUNNER_TEMP/$(basename "$APK").cert"
            if [ ! -s "$RUNNER_TEMP/$(basename "$APK").cert" ]; then
              echo "::error::$APK signing certificate digest was not reported."
              exit 1
            fi
            echo "OK: $APK ($PKG $NAME) signed, no network permissions."
          }
          verify buscourse/build/outputs/apk/release/buscourse-release.apk com.istech.buscourse "$VERSION"
          verify buscourse/build/outputs/apk/navi/buscourse-navi.apk com.istech.buscourse.navi "$VERSION-navi"
          # 2つは同じ鍵で署名されていること（片方だけ別の鍵＝取り違え）。
          if ! cmp -s "$RUNNER_TEMP/buscourse-release.apk.cert" "$RUNNER_TEMP/buscourse-navi.apk.cert"; then
            echo "::error::release and navi APKs are signed with different certificates."
            exit 1
          fi
          echo "OK: both APKs share the same signing certificate."

      - name: Stage APK and SHA-256 checksum
        id: stage
        env:
          VERSION: ${{ inputs.version }}
        run: |
          APK_NAME="BusCourse-$VERSION.apk"
          NAVI_NAME="BusCourseNavi-$VERSION.apk"
          cp buscourse/build/outputs/apk/release/buscourse-release.apk "$GITHUB_WORKSPACE/$APK_NAME"
          cp buscourse/build/outputs/apk/navi/buscourse-navi.apk "$GITHUB_WORKSPACE/$NAVI_NAME"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"
          sha256sum "$NAVI_NAME" | tee "$NAVI_NAME.sha256"
          echo "sha256=$(cut -d' ' -f1 "$APK_NAME.sha256")" >> "$GITHUB_OUTPUT"
          echo "navi_sha256=$(cut -d' ' -f1 "$NAVI_NAME.sha256")" >> "$GITHUB_OUTPUT"

      # ★draft は固定（入力で変えられない）。公開はオーナーが GitHub の画面で押す（紙芝居 09-26 改1）。
      # draft の間はタグも作られない＝旧手順のような「タグ一つで公開」の入口が無い。
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          tag_name: buscourse-v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: BusCourse ${{ inputs.version }}
          body: |
            正式版（全部入り）BusCourse-${{ inputs.version }}.apk
            SHA-256: `${{ steps.stage.outputs.sha256 }}`

            ナビ専科 BusCourseNavi-${{ inputs.version }}.apk
            SHA-256: `${{ steps.stage.outputs.navi_sha256 }}`
          files: |
            BusCourse-${{ inputs.version }}.apk
            BusCourse-${{ inputs.version }}.apk.sha256
            BusCourseNavi-${{ inputs.version }}.apk
            BusCourseNavi-${{ inputs.version }}.apk.sha256
