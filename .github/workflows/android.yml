name: Android Build

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BusCourse offline policy: source manifest permissions must be removed explicitly.
      - name: Verify BusCourse source manifest offline policy
        run: |
          set -e
          PATTERN='android:name="android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)"'
          if grep -E "$PATTERN" buscourse/src/main/AndroidManifest.xml | grep -v 'tools:node="remove"' | grep -q .; then
            echo "::error::BusCourse source manifest declares a network permission without tools:node=\"remove\"."
            exit 1
          fi
          echo "OK: source manifest removes all network permissions."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # v3 の既定 packages は旧 SDK Tools `tools` を含み、Google から削除済み。
        with:
          packages: 'platform-tools'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run BusCourse tests and build debug and field APKs
        run: ./gradlew :buscourse:testDebugUnitTest :buscourse:assembleDebug :buscourse:assembleField --no-daemon --stacktrace

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buscourse-test-reports
          path: android/buscourse/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify BusCourse shipped APKs have no network permissions
        run: |
          set -e
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          checked=0
          for apk in buscourse/build/outputs/apk/debug/*.apk buscourse/build/outputs/apk/field/*.apk; do
            [ -f "$apk" ] || continue
            checked=1
            if "$AAPT" dump permissions "$apk" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)'; then
              echo "::error::$apk requests a network permission — BusCourse offline policy violation."
              exit 1
            fi
            echo "OK: $apk has no network permissions."
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::No BusCourse APK found to verify."
            exit 1
          fi

      - name: Verify BusCourse resolved Kotlin matches libs.versions.toml
        run: |
          set -e
          DEPS_FILE="$RUNNER_TEMP/buscourse-kotlin-deps.txt"
          CATALOG="gradle/libs.versions.toml"
          ./gradlew -q :buscourse:dependencies --configuration releaseRuntimeClasspath --no-daemon > "$DEPS_FILE"
          RESOLVED=$(grep -oE 'kotlin-stdlib:[0-9][0-9.]*( -> [0-9][0-9.]*)?' "$DEPS_FILE" \
            | sed -E 's/^kotlin-stdlib:[0-9.]+ -> ([0-9.]+)$/\1/; s/^kotlin-stdlib:([0-9.]+)$/\1/' \
            | sort -u)
          if [ -z "$RESOLVED" ] || [ "$(echo "$RESOLVED" | wc -l)" -ne 1 ]; then
            echo "::error::Could not resolve a single kotlin-stdlib version for BusCourse."
            exit 1
          fi
          CATALOG_KOTLIN=$(grep -E '^kotlin = ' "$CATALOG" | sed -E 's/^kotlin = "([0-9.]+)"/\1/')
          if [ -z "$CATALOG_KOTLIN" ] || [ "$(echo "$RESOLVED" | cut -d. -f1,2)" != "$(echo "$CATALOG_KOTLIN" | cut -d. -f1,2)" ]; then
            echo "::error::Resolved kotlin-stdlib $RESOLVED does not match the catalog Kotlin $CATALOG_KOTLIN."
            exit 1
          fi
          echo "OK: BusCourse kotlin-stdlib $RESOLVED matches Kotlin $CATALOG_KOTLIN."

      - name: Verify BusCourse network library allowlist
        run: |
          set -e
          DEPS_FILE="$RUNNER_TEMP/buscourse-deps.txt"
          ALLOWLIST="ci/offline-allowlist.yml"
          NETWORK_LIB_PATTERN='okhttp|retrofit|ktor-client|volley|grpc|apache\.http|cronet'
          ./gradlew -q :buscourse:dependencies --configuration releaseRuntimeClasspath --no-daemon > "$DEPS_FILE"
          ALLOWED=$(awk '/^- group:/ { g = $3 } /^  artifact:/ { print g ":" $2 }' "$ALLOWLIST")
          FOUND=$(grep -Ei "$NETWORK_LIB_PATTERN" "$DEPS_FILE" \
            | sed -E 's/^[ |\+-]+//' | sed -E 's/ .*$//' | cut -d: -f1,2 | sort -u) || true
          unlisted=0
          for ga in $FOUND; do
            if echo "$ALLOWED" | grep -qxF "$ga"; then
              echo "OK (allowlisted): $ga"
            else
              echo "::error::Unlisted network library in BusCourse: $ga — add a reasoned entry to android/ci/offline-allowlist.yml."
              unlisted=1
            fi
          done
          if [ "$unlisted" -ne 0 ]; then exit 1; fi
          if [ -z "$FOUND" ]; then echo "OK: no known network libraries in BusCourse releaseRuntimeClasspath."; fi

      # ★debug・field の APK は成果物として上げない。公開リポジトリの成果物は GitHub にログインした誰でも落とせる。
      # 配る APK は release.yml のドラフトだけ（紙芝居 09-26 改1）。
